# Weekly: index every competition Flashscore covers into data/leagues.json on the "data" branch.
# The app downloads it (and keeps a copy) for the Leagues tab.
name: Leagues index
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build_leagues.py leagues.json
      - name: Publish to the data branch
        run: |
          mkdir pub && mv leagues.json pub/ && cd pub
          git init -q && git checkout -q -b data
          git config user.name index && git config user.email index@users.noreply.github.com
          git add -A && git commit -qm "Leagues index $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
