name: Probe Flashscore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          H=https://global.flashscore.ninja/2/x/feed
          get() { curl -sS -m 20 -A "$UA" -H 'x-fsign: SW9D1eZo' -H 'Referer: https://www.flashscore.com/' -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> status.txt || echo "$1 fail" >> status.txt; }
          for s in 1 2 3 4; do get "sport$s.txt" "$H/f_${s}_0_0_en_1"; done
          get y1.txt "$H/f_1_-1_0_en_1"
          get y3.txt "$H/f_3_-1_0_en_1"
          get y2.txt "$H/f_2_-1_0_en_1"
          python3 - <<'PY'
          import re
          def fin(f, big):
              t=open(f,encoding='utf8').read(); lg=''
              for r in t.split('~'):
                  if r.startswith('ZA'): lg=r
                  elif r.startswith('AA') and '¬AB÷3¬' in r and (not big or big in lg): return re.search('AA÷([^¬]+)',r).group(1)
          open('ids','w').write(' '.join([fin('y1.txt','ENGLAND: Premier League') or fin('y1.txt','SPAIN') or fin('y1.txt','ENGLAND') or fin('y1.txt',''), fin('y3.txt','USA: NBA') or fin('y3.txt',''), fin('y2.txt','ATP') or fin('y2.txt','')]))
          PY
          set -- $(cat ids); echo "ids $*" >> status.txt
          for f in df_sui df_st df_li df_hh dc df_sur; do get "d1_${f}.txt" "$H/${f}_1_$1"; get "d3_${f}.txt" "$H/${f}_1_$2"; get "d2_${f}.txt" "$H/${f}_1_$3"; done
          get st1.txt "$H/to_Gl9hUCqn_hUIdt7w8_1"
          get tres.html "https://www.flashscore.com/team/carlisle/dUzTIwSF/results/"
          get tfix.html "https://www.flashscore.com/team/carlisle/dUzTIwSF/fixtures/"
          get tsq.html "https://www.flashscore.com/team/carlisle/dUzTIwSF/squad/"
          get srch.txt "https://s.livesport.services/api/v2/search/?q=arsenal&lang-id=1&type-ids=1,2,3,4&project-id=2&project-type-id=1"
          cat status.txt
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "Flashscore samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
