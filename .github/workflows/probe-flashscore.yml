name: Probe Flashscore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          H=https://global.flashscore.ninja/2/x/feed
          get() { curl -sS -m 20 -A "$UA" -H 'x-fsign: SW9D1eZo' -H 'Referer: https://www.flashscore.com/' -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> status.txt || echo "$1 fail" >> status.txt; }
          E=vcTsZaNE
          for f in df_sui df_st df_li df_hh df_dos df_sur df_mh df_ml df_lc df_ii df_od dc df_hl df_ps; do get "d_${f}.txt" "$H/${f}_1_$E"; done
          get d_dc.txt "$H/dc_1_$E"
          # standings candidates (tournament Gl9hUCqn, stage 4CWHXGM1, ZEE hUIdt7w8?)
          get s1.txt "$H/to_Gl9hUCqn_4CWHXGM1_1"
          get s2.txt "$H/to_hUIdt7w8_4CWHXGM1_1"
          get s3.txt "$H/to_4CWHXGM1_Gl9hUCqn_1"
          get s4.txt "$H/ss_1_Gl9hUCqn_4CWHXGM1_table_overall"
          # match page html (has ids/urls), team page html
          get mpage.html "https://www.flashscore.com/match/$E/"
          get tpage.html "https://www.flashscore.com/team/carlisle/"
          get lpage.html "https://www.flashscore.com/football/england/national-league/standings/"
          get f1.txt "$H/f_1_0_0_en_1"
          python3 - <<'PY' >> status.txt
          import re
          t=open('f1.txt',encoding='utf8').read()
          live=[r for r in t.split('~') if r.startswith('AA') and '¬AB÷2¬' in r]
          print('live', len(live)); print(live[0][:900] if live else '')
          for n in ['lpage.html','mpage.html']:
              h=open(n,encoding='utf8',errors='ignore').read()
              for k in ['feed_sign','fsign','tournament_id','tournamentStage','environment','standings','x/feed/']:
                  for m in re.finditer(k,h):
                      print(n,k,h[max(0,m.start()-80):m.start()+160].replace('\n',' ')); break
          PY
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "Flashscore samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
