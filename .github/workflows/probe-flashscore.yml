name: Probe Flashscore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          H=https://global.flashscore.ninja/2/x/feed
          get() { curl -sS -m 20 -A "$UA" -H 'x-fsign: SW9D1eZo' -H 'Referer: https://www.flashscore.com/' -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> status.txt || echo "$1 fail" >> status.txt; }
          for s in 1 2 3 4 5 6 7 8 12 13 19 14 15 16 17 18 21 22 23 24 25 26 36 42; do get "sport$s.txt" "$H/f_${s}_0_0_en_1"; done
          get s1.txt "$H/ss_1_Gl9hUCqn_hUIdt7w8_table_overall"
          get s2.txt "$H/to_Gl9hUCqn_hUIdt7w8_1"
          get s3.txt "$H/ss_1_hUIdt7w8_Gl9hUCqn_table_overall"
          get s4.txt "$H/st_1_Gl9hUCqn_hUIdt7w8_table_overall"
          get lpage.html "https://www.flashscore.com/football/england/national-league/standings/"
          get tpage.html "https://www.flashscore.com/team/carlisle/dUzTIwSF/"
          get tres.html "https://www.flashscore.com/team/carlisle/dUzTIwSF/results/"
          get srch.txt "https://s.livesport.services/api/v2/search/?q=arsenal&lang-id=1&type-ids=1,2,3,4&project-id=2&project-type-id=1"
          python3 - <<'PY' >> status.txt
          import re,subprocess
          t=open('sport1.txt',encoding='utf8').read()
          live=[r for r in t.split('~') if r.startswith('AA') and '¬AB÷2¬' in r]
          ids=[re.search('AA÷([^¬]+)',r).group(1) for r in live][:2]
          print('liveids',ids)
          open('liveids','w').write(' '.join(ids))
          h=open('lpage.html',encoding='utf8',errors='ignore').read()
          js=sorted(set(re.findall(r'https://static\.flashscore\.com/res/_fs/build/[a-zA-Z0-9_.\-]+\.js',h)))
          open('jslist','w').write('\n'.join(js))
          print('js',len(js))
          PY
          for id in $(cat liveids); do get "live_dc_$id.txt" "$H/dc_1_$id"; get "live_sui_$id.txt" "$H/df_sui_1_$id"; done
          mkdir js && for u in $(cat jslist); do curl -sS -m 20 "$u" -o "js/$(basename $u)"; done
          grep -ohE '.{60}(_hash|pq_graphql|table_overall|ss_1_|to_%|x/feed|/feed/).{100}' js/*.js | sort -u | head -80 > jsgrep.txt
          grep -ohE '"[a-z]{2,6}_?[a-z]*"\s*:\s*"[a-z]{2,8}"' js/*.js | sort -u | head -60 >> jsgrep.txt
          rm -rf js
          cat status.txt
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "Flashscore samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
