name: Validate forecasts, glass and live alerts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-syntax.cjs
      - run: node --experimental-default-type=module --test tests/*.test.js
      - run: npx expo export --platform android --output-dir /tmp/fast-score-export --no-bytecode
      - run: npx expo prebuild --platform android --no-install
      - name: Compile and test native alert scheduling
        working-directory: android
        run: ./gradlew :fast-live:compileDebugKotlin :fast-live:testDebugUnitTest --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Android lint
        working-directory: android
        run: ./gradlew :fast-live:lintDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-score-audit-reports
          path: |
            modules/fast-live/android/build/reports/lint-results-debug.*
            modules/fast-live/android/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
