name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          H=https://global.flashscore.ninja/2/x/feed
          get() { curl -sSL -m 25 -A "$UA" -H 'x-fsign: SW9D1eZo' -H 'Referer: https://www.flashscore.com/' -o "$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> status.txt || echo "$1 fail" >> status.txt; }
          E=fXmefEGl
          DS=https://2.ds.lsapp.eu/pq_graphql
          get mm1.txt "$DS?_hash=mmts&eventId=$E&projectId=2"
          get mm2.txt "$DS?_hash=mmte&eventId=$E&projectId=2"
          get od1.txt "$DS?_hash=ope&eventId=$E&projectId=2&geoIpCode=GH&geoIpSubdivisionCode=GHAA"
          get od2.txt "https://global.ds.lsapp.eu/odds/pq_graphql?_hash=ope&eventId=$E&projectId=2&geoIpCode=GH&geoIpSubdivisionCode=GHAA"
          get ts1.txt "$DS?_hash=dsos2&eventId=$E&projectId=2"
          get ms_home2.html "https://www.msport.com/gh/sports/football"
          mkdir msjs
          for u in https://static.msport.com/gh/main/js/chunk-base.65f29a38.js https://static.msport.com/gh/main/js/chunk-utils.9cca4cbb.js https://static.msport.com/gh/main/js/index.7a2d9df5.js; do curl -sS -m 30 "$u" -o "msjs/$(basename $u)"; done
          python3 - <<'PY' > msapi.txt
          import re,glob
          for f in glob.glob('msjs/*.js'):
              t=open(f,encoding='utf8',errors='ignore').read()
              print('##',f,len(t))
              for m in re.finditer(r'["\'`](/api/[^"\'`]{2,140}|/[a-z\-]+-center/[^"\'`]{2,140}|facts[^"\'`]{2,100})["\'`]',t):
                  print(m.group(1))
              for k in ['baseURL','apiPrefix','/api/','operId','x-operid','OperId','clientid','ClientId']:
                  for m in list(re.finditer(re.escape(k),t))[:4]:
                      print('CTX',k,'::',t[max(0,m.start()-150):m.start()+200].replace('\n',' '))
              # find chunk names for lazy loading
              print('CHUNKS', sorted(set(re.findall(r'"(chunk-[a-z0-9\-]+)":"([0-9a-f]{8})"',t)))[:80])
          PY
          for c in $(grep -oE 'chunk-[a-z0-9-]*sport[a-z0-9-]*":"[0-9a-f]{8}' msapi.txt | head -6 | tr -d '"' | tr ':' '.'); do curl -sS -m 30 "https://static.msport.com/gh/main/js/$c.js" -o "msjs/$c.js"; done
          grep -ohE '.{100}(/api/|facts-center).{160}' msjs/*.js | sort -u | head -60 > msapi2.txt
          for u in "https://www.msport.com/api/gh/facts-center/query/frontend/get-events?sportId=sr:sport:1" "https://www.msport.com/api/gh/facts-center/query/frontend/match-list?sportId=sr:sport:1" "https://www.msport.com/api/gh/facts-center/query/frontend/live-matches/list?sportId=sr:sport:1"; do n=$(echo $u | md5sum | cut -c1-6); get "msp_$n.txt" "$u"; done
          rm -rf msjs
          cat status.txt
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
