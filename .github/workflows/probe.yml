name: probe-crash
on: { push: { branches: [probe-crash] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out && node sniff.js; ls out | head -50
          curl -s -o out/robots.txt https://m.aiscore.com/robots.txt; curl -s -D out/hdr.txt -o /dev/null https://m.aiscore.com/en
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@x
          git checkout --orphan probe-out; git rm -rqf . ; git add -f out; git commit -qm out; git push -f origin probe-out
