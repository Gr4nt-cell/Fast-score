name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          MS=https://www.msport.com/api/gh/facts-center/query/frontend
          msget() { curl -sS -m 25 -A "$UA" -H 'operId: 3' -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> status.txt; }
          curl -sS -m 30 -A "$UA" https://www.msport.com/gh -o ms.html
          mkdir msjs; for u in $(grep -oE 'https://static\.msport\.com/gh/main/js/[A-Za-z0-9._\-]+\.js' ms.html | sort -u); do curl -sS -m 30 -A "$UA" "$u" -o "msjs/$(basename $u)"; done
          grep -ohE '.{400}all-matches/(today|next-7-days).{400}' msjs/*.js | head -6 > ctx_today.txt
          grep -ohE '.{300}sports-matches-list.{500}' msjs/*.js | head -4 > ctx_sml.txt
          grep -ohE '.{20}(pageNum|pageSize|pageIndex|pageNo|lastEventId|startIndex|offset)\b.{80}' msjs/*.js | sort -u | head -40 > ctx_page.txt
          for q in "pageNum=2" "pageIndex=2" "page=2" "pageNo=2" "pageNum=2&pageSize=50" "offset=50" "startIndex=50"; do n=$(echo $q | tr '=&' '__'); msget "t_$n.json" "$MS/all-matches/today?sportId=sr:sport:1&$q"; done
          msget top.json "$MS/all-matches/top-league?sportId=sr:sport:1"
          msget hl.json "$MS/soccer-matches/high-light?sportId=sr:sport:1"
          msget countries.json "$MS/all-matches/countries?sportId=sr:sport:1"
          python3 - <<'PY' >> status.txt
          import json,glob
          base=None
          for f in sorted(glob.glob('t_*.json'))+['top.json','hl.json','countries.json']:
              try:
                  d=json.load(open(f))['data']
                  ev=d.get('events') if isinstance(d,dict) else d
                  ids=[e.get('eventId') for e in (ev or []) if isinstance(e,dict)]
                  print(f, type(d).__name__, list(d.keys())[:8] if isinstance(d,dict) else len(d), len(ids), ids[:2], [e.get('tournament') for e in (ev or [])[:3] if isinstance(e,dict)])
                  if f=='countries.json': print(json.dumps(d)[:1500])
              except Exception as e: print(f,'ERR',e)
          PY
          cat status.txt
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add *.txt *.json && git commit -qm "samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
