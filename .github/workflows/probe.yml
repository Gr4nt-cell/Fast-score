name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in privacy child-safety; do
            code=$(curl -s -o page.html -w "%{http_code}" "https://fast-score.gstephen116.workers.dev/$p")
            title=$(grep -o '<h1>[^<]*' page.html | head -1)
            echo "::notice::$p HTTP $code $title $(wc -c < page.html) bytes"
          done
