name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          get() { curl -sSL -m 25 -A "$UA" -H 'x-fsign: SW9D1eZo' -H 'Referer: https://www.flashscore.com/' -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> status.txt || echo "$1 fail" >> status.txt; }
          get fb.html "https://www.flashscore.com/football/"
          get req198.txt "https://www.flashscore.com/x/req/m_1_198"
          get req198b.txt "https://global.flashscore.ninja/2/x/req/m_1_198"
          get ft198.txt "https://global.flashscore.ninja/2/x/feed/ft_1_198"
          get eng.html "https://www.flashscore.com/football/england/"
          python3 - <<'PY' >> status.txt
          import re
          h=open('fb.html',encoding='utf8',errors='ignore').read()
          for k in ['lmenu_','country_','leftMenu','cjs.initialFeeds','tournament_','/football/england/','menu']:
              ms=list(re.finditer(k,h)); print('##',k,len(ms))
              for m in ms[:3]: print('   ',h[max(0,m.start()-200):m.start()+300].replace('\n',' '))
          e=open('eng.html',encoding='utf8',errors='ignore').read()
          links=sorted(set(re.findall(r'href="(/football/england/[a-z0-9\-]+/)"',e)))
          print('eng links',len(links),links[:40])
          PY
          head -c 1500 req198.txt >> status.txt; echo >> status.txt; head -c 800 req198b.txt >> status.txt; echo >> status.txt; head -c 800 ft198.txt >> status.txt
          cat status.txt | cut -c1-3000
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm "samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
