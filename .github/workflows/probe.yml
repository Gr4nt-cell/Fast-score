name: probe-crash
on: { push: { branches: [probe-crash] } }
permissions: { contents: write, actions: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: builds, path: b, sparse-checkout: fast-score-1.0.0-169.apk, sparse-checkout-cone-mode: false }
      - run: mkdir apk && mv b/fast-score-1.0.0-169.apk apk/ && rm -rf b
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          profile: pixel_6
          script: |
            mkdir -p out; ls apk; adb install -r $(ls apk/*.apk | head -1); adb logcat -c; python3 drive.py | tee out/drive.txt; adb logcat -d > out/logcat.txt
      - if: always()
        run: |
          grep -E "FATAL|AndroidRuntime|ReactNativeJS|Exception|chromium" out/logcat-*.txt | head -150 || true
          git config user.name probe; git config user.email probe@x
          git checkout --orphan probe-out; git rm -rqf . ; git add -f out; git commit -qm out; git push -f origin probe-out
