name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          get() { curl -sSL -m 25 -A "$UA" -H 'x-fsign: SW9D1eZo' -H 'Referer: https://www.flashscore.com/' -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> status.txt || echo "$1 fail" >> status.txt; }
          F=https://global.flashscore.ninja/2/x/feed
          for L in euro uefa-nations-league champions-league; do
            get "$L.html" "https://www.flashscore.com/football/europe/$L/standings/"
            python3 - "$L" <<'PY' >> status.txt
          import re,sys
          L=sys.argv[1]; h=open(L+'.html',encoding='utf8',errors='ignore').read()
          tid=re.search(r'tournamentId:\s*"([^"]+)"',h); sid=re.search(r'tournamentStageId:\s*"([^"]+)"',h)
          print('##',L,tid and tid.group(1), sid and sid.group(1))
          open(L+'.ids','w').write(f"{tid.group(1) if tid else ''} {sid.group(1) if sid else ''}")
          feeds=re.findall(r'cjs\.initialFeeds\[[\'"]([^\'"]+)[\'"]\]\s*=\s*\{\s*data:\s*`([^`]*)`',h)
          print('  feeds',[(n,len(d)) for n,d in feeds])
          seen=set()
          for n,d in feeds:
              for r in d.split('~'):
                  if r.startswith('ZA÷'):
                      f=dict(x.split('÷',1) for x in r.split('¬') if '÷' in x)
                      k=(f.get('ZA'),f.get('ZC'),f.get('ZE'))
                      if k not in seen: seen.add(k); print('   stage',n,k)
          for k in ['League B','League C','Qualification']:
              ms=list(re.finditer(k,h)); print('  ',k,len(ms))
              for m in ms[:3]: print('     ',h[max(0,m.start()-200):m.start()+120].replace('\n',' '))
          PY
            read T S < "$L.ids" || true; get "$L.to.txt" "$F/to_${T}_${S}_1"
          done
          cat status.txt | cut -c1-500
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add *.txt && git commit -qm "samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
