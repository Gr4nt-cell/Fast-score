name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          MS=https://www.msport.com/api/gh/facts-center/query/frontend
          curl -sS -m 25 -A "$UA" -H 'operId: 3' "$MS/all-matches/countries?sportId=sr:sport:1" -o countries.json
          python3 - <<'PY' > ids.json
          import json
          d=json.load(open('countries.json'))['data']; ids=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('tournamentId'): ids.append(x['tournamentId'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d); ids=list(dict.fromkeys(ids)); print(json.dumps(ids))
          PY
          python3 -c "import json;i=json.load(open('ids.json'));print('tournaments',len(i));json.dump(i[:60],open('b60.json','w'));json.dump(i[:5],open('b5.json','w'));json.dump({'tournamentIds':i[:5]},open('bo.json','w'))" >> status.txt
          for b in b5 b60 bo; do curl -sS -m 30 -A "$UA" -H 'operId: 3' -H 'Content-Type: application/json' -X POST --data @$b.json "$MS/sports-matches-list?sportId=sr:sport:1" -o r_$b.json -w "$b %{http_code} %{size_download}\n" >> status.txt; done
          curl -sS -m 30 -A "$UA" -H 'operId: 3' -H 'Content-Type: application/json' -X POST --data @b5.json "$MS/sports-matches-list" -o r_noq.json -w "noq %{http_code} %{size_download}\n" >> status.txt
          python3 - <<'PY' >> status.txt
          import json
          for f in ['r_b5.json','r_b60.json','r_bo.json','r_noq.json']:
              try:
                  j=json.load(open(f)); d=j.get('data'); s=json.dumps(d)
                  print(f, j.get('bizCode'), j.get('message'), type(d).__name__, (list(d.keys()) if isinstance(d,dict) else len(d or [])), s.count('"eventId"'), s[:300])
              except Exception as e: print(f,'ERR',e)
          PY
          cat status.txt
      - name: Save to the probe branch
        run: |
          cd out
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add status.txt && git commit -qm "samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
