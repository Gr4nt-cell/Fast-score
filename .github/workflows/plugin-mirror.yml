# Copies every library the Android build downloads (except Google's own, which is reachable
# everywhere) into the "m2" branch as a plain Maven repository, so the app can be built on
# machines that can't reach Maven Central or the Gradle plugin portal.
name: Plugin mirror
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Download every plugin and dependency (a real build)
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Collect what Maven Central / Google don't have
        run: |
          python3 - <<'PY'
          import os, shutil, urllib.request
          root = os.path.expanduser('~/.gradle/caches/modules-2/files-2.1')
          out = 'm2'
          def exists(url):
              try:
                  req = urllib.request.Request(url, method='HEAD')
                  return urllib.request.urlopen(req, timeout=20).status == 200
              except Exception:
                  return False
          n = 0
          for g in sorted(os.listdir(root)):
              for a in sorted(os.listdir(os.path.join(root, g))):
                  for v in sorted(os.listdir(os.path.join(root, g, a))):
                      # everything except Google's own Android artifacts (dl.google.com is reachable)
                      path = f"{g.replace('.', '/')}/{a}/{v}/{a}-{v}.pom"
                      if exists('https://dl.google.com/dl/android/maven2/' + path):
                          continue
                      dest = os.path.join(out, g.replace('.', '/'), a, v)
                      os.makedirs(dest, exist_ok=True)
                      for h in os.listdir(os.path.join(root, g, a, v)):
                          for f in os.listdir(os.path.join(root, g, a, v, h)):
                              src = os.path.join(root, g, a, v, h, f)
                              shutil.copy(src, os.path.join(dest, f))
                      n += 1
                      print('mirrored', g, a, v)
          print('total', n)
          # Gradle module files can point at another module ("available-at"): fetch those too
          import json, glob
          done = set()
          for mf in glob.glob(out + '/**/*.module', recursive=True):
              try:
                  j = json.load(open(mf))
              except Exception:
                  continue
              for v in j.get('variants', []):
                  at = v.get('available-at')
                  if not at:
                      continue
                  g, a, ver = at['group'], at['module'], at['version']
                  if (g, a, ver) in done:
                      continue
                  done.add((g, a, ver))
                  base = f"{g.replace('.', '/')}/{a}/{ver}/"
                  dest = os.path.join(out, base)
                  os.makedirs(dest, exist_ok=True)
                  names = [f'{a}-{ver}.module', f'{a}-{ver}.pom']
                  for name in names:
                      for repo in ['https://repo1.maven.org/maven2/', 'https://dl.google.com/dl/android/maven2/']:
                          try:
                              data = urllib.request.urlopen(repo + base + name, timeout=60).read()
                              open(os.path.join(dest, name), 'wb').write(data)
                              if name.endswith('.module'):
                                  for vv in json.loads(data).get('variants', []):
                                      for fl in vv.get('files', []):
                                          if not os.path.exists(os.path.join(dest, fl['url'])):
                                              try:
                                                  open(os.path.join(dest, fl['url']), 'wb').write(urllib.request.urlopen(repo + base + fl['url'], timeout=120).read())
                                              except Exception as e:
                                                  print('miss', base + fl['url'], e)
                              break
                          except Exception:
                              pass
                  print('available-at', g, a, ver)
          # GitHub refuses files over 100 MB: split them; the build machine joins them back
          for root_, _, files in os.walk(out):
              for f in files:
                  path = os.path.join(root_, f)
                  if os.path.getsize(path) > 90 * 1024 * 1024:
                      with open(path, 'rb') as fh:
                          i = 0
                          while True:
                              chunk = fh.read(80 * 1024 * 1024)
                              if not chunk:
                                  break
                              open(f'{path}.part{i:02d}', 'wb').write(chunk)
                              i += 1
                      os.remove(path)
                      print('split', path, i)
          PY
          du -sh m2
      - name: Push to the m2 branch
        run: |
          cd m2
          git init -q && git checkout -q -b m2
          git config user.name mirror && git config user.email mirror@users.noreply.github.com
          git add -A && git commit -qm "Gradle plugin-portal mirror"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" m2
