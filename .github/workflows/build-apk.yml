name: Build signed Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'wrangler.toml'
      - '.github/workflows/odds.yml'
      - '.github/workflows/leagues-index.yml'
      - '.github/workflows/plugin-mirror.yml'
      - '.github/workflows/deploy-server.yml'
      - '.github/workflows/check-server.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Require signing credentials
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" || {
            echo "::error::Android signing secrets are missing. Refusing a debug-signed release."
            exit 1
          }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check context model
        run: node --experimental-default-type=module --test tests/competition-context.test.js tests/tracked-keys.test.js tests/notification-sound-config.test.js tests/fixture-board-cache.test.js tests/pick-archive.test.js tests/storage-recovery.test.js
      - name: Set version code
        run: |
          export VERSION_CODE=$((100 + $(git rev-list --count HEAD)))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p="app.json";const j=JSON.parse(fs.readFileSync(p));j.expo.android.versionCode=Number(process.env.VERSION_CODE);fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              upload {
                storeFile file(System.getenv("RUNNER_TEMP") + "/upload.jks")
                storePassword System.getenv("UPLOAD_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("UPLOAD_PASSWORD")
              }
            }
            buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
      - name: Build signed APK and AAB
        working-directory: android
        env:
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Verify signatures and export public certificate
        env:
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/fast-score.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/fast-score.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs release/fast-score.apk
          jarsigner -verify release/fast-score.aab | grep -q 'jar verified'
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/upload.jks" -storepass:env UPLOAD_PASSWORD -alias upload -file release/upload-certificate.pem
          sha256sum release/fast-score.apk release/fast-score.aab > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fast-score-signed-android
          path: release/
          if-no-files-found: error
      - name: Publish built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Fast Score Android" --notes "Signed Android builds."
          gh release upload latest release/* --clobber
          gh release edit latest --notes "Built from ${GITHUB_SHA}. APK and AAB are signed with the Fast Score upload key. The PEM is the public certificate, not the private key."
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
