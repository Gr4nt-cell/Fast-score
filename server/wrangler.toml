# Fast Score API — Cloudflare Worker + D1 (free plan).
# Deployed by Cloudflare's GitHub integration (Workers Builds) with root directory "server".
# The D1 database is created automatically on the first deploy (wrangler's resource
# provisioning), and the Worker creates its own tables the first time it runs.
name = "fast-score"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# every minute: refresh live competitions, rotate through the rest
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fastscore"
migrations_dir = "migrations"

[vars]
# ESPN downloads per minute; the free plan allows 50 subrequests per run
MAX_FETCH = "14"
